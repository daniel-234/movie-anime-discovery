app = 'movie-anime-discovery-platform'
primary_region = 'fra'
console_command = 'python manage.py shell'

[build]

[[mounts]]
  source = 'app_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[[statics]]
  guest_path = '/app/staticfiles'
  url_prefix = '/static/'