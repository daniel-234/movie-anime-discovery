{% extends "base.html" %}

{% block title %}Dashboard — Discover{% endblock %}

{% block content %}
<div class="min-h-screen grid place-items-center bg-cream px-4">
  <div class="w-full max-w-md bg-cream-soft p-8 rounded-lg border border-line">
    <h1 class="text-2xl font-bold text-ink mb-2">Dashboard</h1>
    <p class="text-sm text-ink-2 mb-6">Welcome back, {{ user.first_name|default:user.username }}.</p>

    {% if messages %}
      <div class="grid gap-2 mb-6">
        {% for message in messages %}
          <p class="text-sm p-3 rounded {% if message.tags == 'success' %}bg-green-100 text-green-800{% else %}bg-red-100 text-red-800{% endif %}">
            {{ message }}
          </p>
        {% endfor %}
      </div>
    {% endif %}

    <div class="grid gap-3">
      <a href="{% url 'edit_profile' %}" class="w-full bg-forest hover:bg-forest-deep text-cream py-2 rounded transition-colors text-center">
        Edit profile
      </a>
    </div>
  </div>
</div>
{% endblock %}
