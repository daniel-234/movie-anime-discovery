{% extends "base.html" %}

{% block title %}Dashboard — Discover{% endblock %}

{% block content %}
<div class="min-h-screen grid place-items-center bg-cream px-4">
  <div class="w-full max-w-md bg-cream-soft p-8 rounded-lg border border-line">
    <h1 class="text-2xl font-bold text-ink mb-2">Dashboard</h1>
    <p class="text-sm text-ink-2 mb-6">Welcome back, {{ user.first_name|default:user.username }}.</p>

    <div class="mb-6">
      <a href="{% url 'account:edit_profile' %}"
        class="group inline-grid grid-cols-[auto_auto_auto] items-center gap-2 px-3 py-1.5 rounded-full
                bg-cream border border-line text-sm text-ink
                hover:bg-cream-soft hover:border-ink-2 transition-colors">
        <img src="{{ user.profile.country.flag }}"
            alt=""
            class="h-4 w-auto rounded-sm">
        <span class="font-medium">{{ user.profile.country.name }}</span>
        <span class="text-xs text-ink-2 opacity-0 group-hover:opacity-100 transition-opacity">
          Edit
        </span>
      </a>
    </div>

    <div class="grid gap-3">
      <a href="{% url 'account:edit_profile' %}" class="w-full bg-forest hover:bg-forest-deep text-cream py-2 rounded transition-colors text-center">
        Edit profile
      </a>
    </div>
  </div>
</div>
{% endblock %}
